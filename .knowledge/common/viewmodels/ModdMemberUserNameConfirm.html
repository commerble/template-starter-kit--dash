<h2>ModdMemberUserNameConfirm</h2>

<h4>Crosswarp.Modd.Controllers.ViewModels.ChangeUserName</h4>
<table class=''><tbody><tr><td>UserName</td><td>String</td><td>Required, <a href='../validations.html/#email'>Email</a></td></tr></tbody></table>

<style type="text/css">.wy-nav-content { max-width: none !important; } .close { display:none !important; }</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        Array.from(document.querySelectorAll('.toggle')).forEach(function (el) {
            el.addEventListener('click', function(e) {
                Array.from(e.target.parentElement.children).filter(x => x !== e.target).forEach(x => x.classList.toggle('close'));
            })
        })
    })
</script>

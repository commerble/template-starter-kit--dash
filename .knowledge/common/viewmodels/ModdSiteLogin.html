<h2>ModdSiteLogin</h2>

<h4>Crosswarp.Modd.Controllers.ViewModels.Login</h4>
<table class=''><tbody><tr><td>CreatePersistentCookie</td><td>Nullable&lt;Boolean&gt;</td><td></td></tr><tr><td>OneTimePassword</td><td>String</td><td></td></tr><tr><td>Password</td><td>String</td><td>System.Web.Mvc.AllowHtmlAttribute, Required</td></tr><tr><td>UserName</td><td>String</td><td>Required, System.ComponentModel.DisplayNameAttribute</td></tr></tbody></table>

<style type="text/css">.wy-nav-content { max-width: none !important; } .close { display:none !important; }</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        Array.from(document.querySelectorAll('.toggle')).forEach(function (el) {
            el.addEventListener('click', function(e) {
                Array.from(e.target.parentElement.children).filter(x => x !== e.target).forEach(x => x.classList.toggle('close'));
            })
        })
    })
</script>
